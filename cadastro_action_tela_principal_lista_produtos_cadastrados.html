<ol class="breadcrumb page-breadcrumb">
  <li class="breadcrumb-item"><a href="javascript:void(0);">Home</a></li>
  <li class="breadcrumb-item active">Produtos</li>
  <li class="position-absolute pos-top pos-right d-none d-sm-block dataAtual"></li>
</ol>
<div class="subheader">
  <h1 class="subheader-title">
    <i class='subheader-icon fal fa-chart-area'></i>Produtos
  </h1>
</div>
<div class="row">
  <div class="col-xl-12">
    <div class="panel">
      <div class="panel-container show">
        <div class="panel-content">
          <div class="panel-tag">
            <div class="row">
              <div class="col-sm-6 col-xl-1">
                <label class="form-label" title="Código do Produto" for="idProdutoDigitar">Cód.Produto</label>
                <div class="input-group">
                  <input type="text" id="idProdutoDigitar" name="idProdutoDigitar" class="form-control input" autocomplete="off" title="Código do Produto" value="">
                </div>
              </div>
              <div class="col-sm-6 col-xl-2">
                <label class="form-label" title="Código de Barras" for="codBarrasDigitar">Cód.Barras</label>
                <div class="input-group">
                  <input type="text" id="codBarrasDigitar" name="codBarrasDigitar" class="form-control input" autocomplete="off" title="Código de Barras" value="">
                </div>
              </div>
              <div class="col-sm-6 col-xl-3">
                <label class="form-label" title="Descrição do Produto" for="nomeProdutoDigitar">Descrição</label>
                <div class="input-group">
                  <input type="text" id="nomeProdutoDigitar" name="nomeProdutoDigitar" class="form-control input" autocomplete="off" title="Descrição do Produto" value="">
                </div>
              </div>
              <div class="col-sm-2 col-xl-2">
                <label class="form-label" title="Data Início de Cadastro/Atualização" for="dtInicioDigitar">Data Início Cadastro/Atualização</label>
                <input class="form-control" id="dtInicioDigitar" type="date" title="Data Início de Cadastro/Atualização" name="dtInicioDigitar" value="">
              </div>
              <div class="col-sm-2 col-xl-2">
                <label class="form-label" title="Data Fim de Cadastro/Atualização" for="dtFimDigitar">Data Fim Cadastro/Atualização</label>
                <input class="form-control" id="dtFimDigitar" type="date" title="Data Fim de Cadastro/Atualização" name="dtFimDigitar" value="">
              </div>
            </div>
            <div class="row">
              <div class="col-sm-8 col-xl-6">
                <br>
                <button class="btn btn-primary" type="button" onclick="pesquisarProdutosCadastrados()"><span
                    class="fal fa-search mr-1"></span>Pesquisar Produtos</button>
                <button class="btn btn-danger" type="button" onclick="modalCadastrarNovoProduto()"><span
                    class="fal fa-plus mr-1"></span>Cadastrar Produtos</button>
              </div>
            </div>
          </div>
          <div id="resultadoListaProdutosCadastrados" class="row"></div>
        </div>
      </div>
    </div>
  </div>
</div>
