<div id="form-editar-produto">

    .tooltip-box {

      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      pointer-events: none;
      z-index: 9999;
    }
  
    .tooltip-box.show {
      opacity: 1;
    }
  </style>

        </div>
      </div>
    </div>
  </div>

      </div>

      </div>
      <div class="col-sm-6 col-xl-2">
        <label class="form-label" for="referenciaModalEditarProdutoCadastrado">Referência</label>

    $("#vrUnitarioModalEditarProdutoCadastrado").mask('#.##0,00', { reverse: true,  placeholder: '0,00' }).data('mask-applied', true);
